[pytest]
# Carpeta donde pytest busca los tests y raíz agregada al PYTHONPATH
# (permite hacer "from pages..." y "from utils..." desde cualquier test).
testpaths = tests
pythonpath = .
python_files = test_*.py

# Opciones que se aplican siempre: salida detallada, markers estrictos
# y reporte HTML autocontenido (CSS, JS y screenshots en un único archivo).
addopts = -v --strict-markers --html=reports/report.html --self-contained-html

# Nivel mínimo de log que pytest captura y muestra en el reporte HTML
log_level = INFO

markers =
    ui: pruebas de interfaz con Selenium WebDriver (SauceDemo)
    api: pruebas de API con Requests (JSONPlaceholder)
    smoke: pruebas críticas y rápidas
    negative: escenarios negativos (datos inválidos, errores esperados)
    demo: test que falla a propósito para mostrar screenshots en el reporte
